</style></head><body><div id="root"></div><noscript><h1>beacon: how strangers find a lost item without the server learning where it is</h1><p>This system shows how a lost item can be found by strangers without the server ever learning where it is. Everything you see at beacon.amayz.dev runs in your one tab against the real backend: the items, the finders and the owner are sprites in the same page, and only encrypted reports, public keys and key hashes ever leave it.</p><p>Enable JavaScript for the walkthrough. The adjacent JSON is the complete readable source.</p></noscript><script id="explainer-data" type="application/json">{"version":1,"title":"beacon: how strangers find a lost item without the server learning where it is","purpose":"This system shows how a lost item can be found by strangers without the server ever learning where it is. Everything you see at beacon.amayz.dev runs in your one tab against the real backend: the items, the finders and the owner are sprites in the same page, and only encrypted reports, public keys and key hashes ever leave it.","scope":"The live simulation as deployed by ecosystem.config.js and docker-compose.yml: one browser tab, the Node forwarder, two Java replicas, one Cassandra node and one ZooKeeper. Four journeys: a finder's report, the spammy finder's 429, the owner's publish-fetch-decrypt loop, and the leader's sweep with the kill-the-leader failover. Each step names the interview concept it shows: singleton, parallelism, Cassandra, ZooKeeper, rate limiting or encryption.","revision":"git a18c342 (clean working tree for the cited files)","limitations":["Authored from reading the code at this revision. The steps are not a recorded trace of a live run; the one observation of the live page is labelled as such in the evidence.","Which replica a finder lands on depends on the hash of its random id. The walkthrough sends finder 2 to A and finder 5 to B, and lets the owner's unpinned calls land on A, as an illustration.","Timings quoted (fetch milliseconds, the 15 s pm2 restart, the 764 ms latch handover) come from the README and code comments, not from this artifact.","Cassandra and ZooKeeper internals are described at the level of the code's comments and the README, not from their sources."],"evidence":[{"id":"sim-header","kind":"code","label":"Everything on the page lives in one tab","detail":"The first three lines of sim.js: items, finders and the owner are objects in this tab, against the real backend.","path":"web/sim.js","lines":[1,3],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"// The simulation. Three lost items, six finders, one owner, all in this tab, against the real backend.\n// Items own a seed and publish public keys; finders encrypt to today's key and post; the owner fetches by\n// key hash and decrypts here. The server only ever sees public keys and ciphertext."},{"id":"sim-constants","kind":"code","label":"The simulation's numbers","detail":"Six finders, finder 5 is spammy, 3 s between a well-behaved finder's reports of one item, 50 ms for the spammy one, the owner polls every 3 s over the last 5 epochs.","path":"web/sim.js","lines":[7,13],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"const FINDER_COUNT = 6;\nconst SPAMMY = 5;               // index of the finder that reports 20 times a second\nconst RANGE = 11;               // percent of the field\nconst REPORT_EVERY_MS = 3000;   // a well-behaved finder reports an item it is near every 3 s\nconst SPAM_EVERY_MS = 50;       // the spammy one: 20 a second\nconst OWNER_POLL_MS = 3000;\nconst LOOKBACK_EPOCHS = 5;      // the owner checks the last 5 epochs' key hashes per item"},{"id":"sim-newfinder","kind":"code","label":"A finder is a sprite with a random id","detail":"newFinder(n): 16 random bytes become the id the tab sends as X-Beacon-Finder; finder 5 is flagged spammy.","path":"web/sim.js","lines":[108,117],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"function newFinder(n) {\n  const spam = n === SPAMMY;\n  const f = {\n    n, spam,\n    id: B64URL.encode(crypto.getRandomValues(new Uint8Array(16))),\n    x: 10 + Math.random() * 80, y: 10 + Math.random() * 80,\n    vx: 0, vy: 0, steerAt: 0, last: new Map(), el: null, inFlight: 0,\n  };\n  f.el = sprite(`finder${spam ? ' spam' : ''}`, spam ? '📱' : '📱', f.x, f.y);\n  label(f.el, spam ? `finder ${n} · spammy, 20/s` : `finder ${n}`);"},{"id":"sim-near","kind":"code","label":"What \"near\" means on the field","detail":"Within RANGE (11 percent of the field) with the y axis scaled to the field's shape.","path":"web/sim.js","lines":[137,137],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"function near(a, b) { const dx = a.x - b.x, dy = (a.y - b.y) * 0.625; return Math.hypot(dx, dy) \u003c RANGE; }"},{"id":"sim-maybereport","kind":"code","label":"When a finder reports","detail":"Each frame, for each item in range, if the per-item gap has passed (3000 ms, or 50 ms for the spammy finder).","path":"web/sim.js","lines":[157,163],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"function maybeReport(f, now) {\n  for (const item of items) {\n    if (!near(f, item)) continue;\n    const last = f.last.get(item) || 0;\n    if (now - last \u003c (f.spam ? SPAM_EVERY_MS : REPORT_EVERY_MS)) continue;\n    f.last.set(item, now);\n    report(f, item);"},{"id":"sim-report","kind":"code","label":"The finder's report, end to end in the tab","detail":"keyFor on the shared item object, encryptReport, a packet with the first hex of the ciphertext, POST /api/reports with the X-Beacon-Finder headers, then the 201 or 429 verdict on the packet.","path":"web/sim.js","lines":[139,154],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"async function report(f, item) {\n  if (f.inFlight \u003e (f.spam ? 8 : 1)) return;\n  f.inFlight++;\n  try {\n    const k = await keyFor(item, epochAt());\n    const plaintext = { item: item.emoji, x: +item.x.toFixed(1), y: +item.y.toFixed(1), finder: f.n, at: new Date().toISOString() };\n    const envelope = await encryptReport(k.publicKey, plaintext);\n    const ct = hex(envelope);\n    const p = packet(f, serverPos, `🔒 ${ct.slice(0, 12)}…`, '');\n    const r = await api('POST', '/api/reports', { keyHash: k.keyHash, ciphertext: B64URL.encode(envelope) }, { 'X-Beacon-Finder': f.id, 'X-Beacon-Finder-Name': `finder ${f.n}${f.spam ? ' spammy' : ''}` });\n    if (r.status === 201) stats.reports201++; else if (r.status === 429) stats.reports429++;\n    if (p) {\n      const verdict = r.status === 201 ? `201 stored ${envelope.length} B` : r.status === 429 ? `429 retry after ${r.headers.get('Retry-After')} s` : `${r.status}`;\n      setTimeout(() =\u003e { p.textContent = verdict; p.classList.add(r.status === 201 ? 'ok' : 'rejected'); }, 700);\n    }\n  } finally { f.inFlight--; }"},{"id":"sim-additem","kind":"code","label":"Minting an item","detail":"A 32-byte seed from getRandomValues, the share id derived from it, then publish().","path":"web/sim.js","lines":[65,76],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"async function addItem(x, y) {\n  if (items.length \u003e= MAX_ITEMS) return;\n  const seed = crypto.getRandomValues(new Uint8Array(32));\n  const item = {\n    emoji: ITEM_EMOJI[items.length % ITEM_EMOJI.length],\n    seed, shareId: await shareIdFromSeed(seed), x, y,\n    keys: new Map(), publishedThrough: -1, el: null, hash: '',\n  };\n  item.el = sprite('item', item.emoji, x, y);\n  items.push(item);\n  await publish(item);\n  await refreshItemLabel(item, false);"},{"id":"sim-publish","kind":"code","label":"Publishing the key schedule","detail":"One public key per epoch from now to now + PUBLISHED_AHEAD, POSTed to /api/schedules/\u003cshareId\u003e.","path":"web/sim.js","lines":[87,92],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"async function publish(item) {\n  const now = epochAt();\n  const keys = [];\n  for (let e = now; e \u003c= now + PUBLISHED_AHEAD; e++) keys.push({ epoch: e, publicKey: B64URL.encode((await keyFor(item, e)).publicKey) });\n  const r = await api('POST', `/api/schedules/${item.shareId}`, { keys });\n  if (r.ok) { item.publishedThrough = now + PUBLISHED_AHEAD; stats.publishes++; }"},{"id":"sim-ownerpoll","kind":"code","label":"The owner's poll","detail":"Key hashes for the last LOOKBACK_EPOCHS epochs of every item, one GET /api/reports, decryptReport per new report, showSeen for the newest.","path":"web/sim.js","lines":[173,197],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"async function ownerPoll() {\n  if (!items.length) return;\n  const now = epochAt();\n  const byHash = new Map();\n  for (const item of items) for (let e = now - LOOKBACK_EPOCHS + 1; e \u003c= now; e++) {\n    const k = await keyFor(item, e); byHash.set(k.keyHash, { item, k });\n  }\n  const r = await api('GET', `/api/reports?${[...byHash.keys()].map(h =\u003e `h=${h}`).join('\u0026')}`);\n  if (!r.ok) return;\n  let fresh = 0;\n  for (const [hash, reports] of Object.entries(r.json)) {\n    const { item, k } = byHash.get(hash);\n    for (const rep of reports) {\n      const id = `${rep.ts}:${hash}`;\n      if (decrypted.has(id)) continue;\n      decrypted.add(id);\n      try {\n        const s = await decryptReport(k.privateKey, B64URL.decode(rep.ciphertext));\n        const cur = seen.get(item);\n        if (!cur || Date.parse(rep.ts) \u003e cur.ts) showSeen(item, { x: s.x, y: s.y, finder: s.finder, ts: Date.parse(rep.ts) });\n        fresh++; stats.sightings++;\n      } catch (e) { console.warn('undecryptable', e); }\n    }\n  }\n  if (fresh) packet(serverPos, ownerPos, `🔓 ${fresh} decrypted here`, 'back');"},{"id":"sim-showseen","kind":"code","label":"The 📍 marker","detail":"showSeen places the marker at the decrypted x, y; the label counts seconds since the report.","path":"web/sim.js","lines":[200,209],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"function showSeen(item, s) {\n  let cur = seen.get(item);\n  if (!cur) { cur = { el: sprite('seen', '📍', s.x, s.y) }; seen.set(item, cur); }\n  Object.assign(cur, s);\n  place(cur.el, s.x + 3, s.y - 3);\n  refreshSeenLabel(item, cur);\n}\n\nfunction refreshSeenLabel(item, cur) {\n  label(cur.el, `${item.emoji} seen ${Math.max(0, Math.round((Date.now() - cur.ts) / 1000))}s ago by finder ${cur.finder}`);"},{"id":"sim-showhealth","kind":"code","label":"The header reads /health","detail":"served-by comes from the X-Beacon-Replica response header, the leader from the JSON; the kill button uses the remembered leader id.","path":"web/sim.js","lines":[214,219],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"async function showHealth() {\n  try {\n    const r = await api('GET', '/health');\n    const served = r.headers.get('X-Beacon-Replica') || r.json?.replica || '?';\n    leader = r.json?.leader ?? '?';\n    $('replica').textContent = `served by ${served} · leader ${leader}`;"},{"id":"sim-openlog","kind":"code","label":"One SSE stream per replica","detail":"openLog(replica) opens EventSource /api/log?replica=A|B; a dropped stream prints a reconnecting line.","path":"web/sim.js","lines":[223,226],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"function openLog(replica) {\n  const es = new EventSource(`/api/log?replica=${replica}`);\n  es.addEventListener('log', ev =\u003e appendLog(ev.data));\n  es.onerror = () =\u003e appendLog(`${replica} (stream down, reconnecting)`);"},{"id":"sim-killleader","kind":"code","label":"The kill button","detail":"POST /api/chaos/kill-leader?replica=\u003cleader\u003e, then the button sleeps 30 s.","path":"web/sim.js","lines":[246,253],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"async function killLeader() {\n  const btn = $('kill');\n  btn.disabled = true;\n  const who = leader;\n  appendLog(`— you pressed kill the leader (${who}); watch [Chaos] and [Leader] below`);\n  const r = await api('POST', `/api/chaos/kill-leader?replica=${who}`);\n  if (!r.ok) appendLog(`— kill refused: ${r.status} ${r.json?.error || ''}`);\n  setTimeout(() =\u003e { btn.disabled = false; }, 30000);"},{"id":"sim-main","kind":"code","label":"Page start","detail":"/health supplies epochSeconds so the tab and server agree on the epoch length; two log streams; three items; six finders; the owner poll.","path":"web/sim.js","lines":[282,301],"sha256":"0eb7874ac0ce61ab1458c39d08b4d5eb919c7c03a6076e73a0aa5911980c7831","excerpt":"async function main() {\n  const h = await api('GET', '/health');\n  if (h.ok \u0026\u0026 h.json.epochSeconds) EPOCH_SECONDS = h.json.epochSeconds;\n  $('epoch-len').textContent = EPOCH_SECONDS;\n  lastEpoch = epochAt();\n  await showHealth();\n  setInterval(showHealth, 3000);\n  openLog('A'); openLog('B');\n  $('kill').onclick = killLeader;\n  field.onclick = ev =\u003e {\n    const r = field.getBoundingClientRect();\n    addItem(((ev.clientX - r.left) / r.width) * 100, ((ev.clientY - r.top) / r.height) * 100);\n  };\n  await addItem(25 + Math.random() * 20, 25 + Math.random() * 30);\n  await addItem(50 + Math.random() * 20, 55 + Math.random() * 25);\n  await addItem(65 + Math.random() * 15, 25 + Math.random() * 20);\n  for (let n = 0; n \u003c FINDER_COUNT; n++) finders.push(newFinder(n));\n  requestAnimationFrame(frame);\n  setInterval(ownerPoll, OWNER_POLL_MS);\n  setTimeout(ownerPoll, 1500);"},{"id":"crypto-header","kind":"code","label":"The protocol in ten lines","detail":"seed to share id and per-epoch scalar by HKDF; finder ECDH with an ephemeral key; owner ECDH from the other side.","path":"web/crypto.js","lines":[1,11],"sha256":"d49470b25e4a47f13d468f3900f3db0288a1fd7d5dfcca58104491fb50a3bd37","excerpt":"// The whole protocol, in the browser, with WebCrypto only.\n//\n//   seed (32 random bytes, owner's browser only)\n//     └─ HKDF-SHA256(seed, \"beacon-share-id\")        → share id (public name for the item)\n//     └─ HKDF-SHA256(seed, \"beacon-epoch-\" + epoch)   → P-256 private scalar for that 15-minute epoch\n//                                                        → public key, published; SHA-256(public key) indexes reports\n//   finder: ephemeral P-256 key, ECDH with the epoch public key, HKDF → AES-256-GCM key, encrypt the location\n//   owner:  same ECDH from the other side with the epoch private key, decrypt\n//\n// This is the shape of Apple's Find My offline finding: rotating keys derived from one secret, ECDH with an\n// ephemeral key per report, and a server that only ever sees public keys and ciphertext."},{"id":"crypto-consts","kind":"code","label":"Epoch length and publish-ahead on the client","detail":"EPOCH_SECONDS is overwritten from /health; the tab publishes 30 epochs ahead.","path":"web/crypto.js","lines":[13,14],"sha256":"d49470b25e4a47f13d468f3900f3db0288a1fd7d5dfcca58104491fb50a3bd37","excerpt":"let EPOCH_SECONDS = 60;        // the server's /health says what it runs; the demo uses 60 s, real Find My 15 min\nconst PUBLISHED_AHEAD = 30;    // epochs published in advance per item (30 minutes in the demo)"},{"id":"crypto-shareid","kind":"code","label":"Share id from the seed","detail":"HKDF-SHA256(seed, \"beacon-share-id\"), 16 bytes, base64url.","path":"web/crypto.js","lines":[37,38],"sha256":"d49470b25e4a47f13d468f3900f3db0288a1fd7d5dfcca58104491fb50a3bd37","excerpt":"async function shareIdFromSeed(seed) {\n  return B64URL.encode(await hkdf(seed, 'beacon-share-id', 16));"},{"id":"crypto-epochkey","kind":"code","label":"One key pair per epoch","detail":"HKDF-SHA256(seed, \"beacon-epoch-N\") is the P-256 scalar; a minimal PKCS#8 wrapper lets WebCrypto compute the public point; SHA-256 of the 65-byte point is the key hash.","path":"web/crypto.js","lines":[46,63],"sha256":"d49470b25e4a47f13d468f3900f3db0288a1fd7d5dfcca58104491fb50a3bd37","excerpt":"async function epochKey(seed, epoch) {\n  let scalar;\n  for (let attempt = 0; ; attempt++) {\n    scalar = await hkdf(seed, `beacon-epoch-${epoch}` + (attempt ? `-${attempt}` : ''), 32);\n    const d = bytesToBigInt(scalar);\n    if (d \u003e 0n \u0026\u0026 d \u003c P256_ORDER) break; // out of range about once in 2^128 tries; loop anyway, like the spec says\n  }\n  const pkcs8 = new Uint8Array(PKCS8_P256_PREFIX.length + 32);\n  pkcs8.set(PKCS8_P256_PREFIX);\n  pkcs8.set(scalar, PKCS8_P256_PREFIX.length);\n  const privateKey = await crypto.subtle.importKey('pkcs8', pkcs8, { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);\n  const jwk = await crypto.subtle.exportKey('jwk', privateKey);\n  const publicKey = new Uint8Array(65);\n  publicKey[0] = 0x04;\n  publicKey.set(B64URL.decode(jwk.x), 1);\n  publicKey.set(B64URL.decode(jwk.y), 33);\n  const keyHash = new Uint8Array(await crypto.subtle.digest('SHA-256', publicKey));\n  return { epoch, privateKey, publicKey, keyHash: B64URL.encode(keyHash) };"},{"id":"crypto-encrypt","kind":"code","label":"Finder side: encryptReport","detail":"Ephemeral P-256 pair, ECDH with the epoch public key, HKDF to AES-256-GCM, random 12-byte nonce; envelope = point (65) + nonce (12) + ciphertext and tag.","path":"web/crypto.js","lines":[75,89],"sha256":"d49470b25e4a47f13d468f3900f3db0288a1fd7d5dfcca58104491fb50a3bd37","excerpt":"// Finder side. Envelope = ephemeral public point (65) || nonce (12) || AES-GCM ciphertext and tag.\nasync function encryptReport(itemPublicKeyRaw, plaintextObject) {\n  const itemPublicKey = await importPublicPoint(itemPublicKeyRaw);\n  const ephemeral = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);\n  const shared = await crypto.subtle.deriveBits({ name: 'ECDH', public: itemPublicKey }, ephemeral.privateKey, 256);\n  const aes = await aesKeyFromSharedSecret(shared);\n  const nonce = crypto.getRandomValues(new Uint8Array(12));\n  const plaintext = new TextEncoder().encode(JSON.stringify(plaintextObject));\n  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: nonce }, aes, plaintext));\n  const ephemeralRaw = new Uint8Array(await crypto.subtle.exportKey('raw', ephemeral.publicKey));\n  const envelope = new Uint8Array(65 + 12 + ct.length);\n  envelope.set(ephemeralRaw, 0);\n  envelope.set(nonce, 65);\n  envelope.set(ct, 77);\n  return envelope;"},{"id":"crypto-decrypt","kind":"code","label":"Owner side: decryptReport","detail":"Split the envelope, ECDH with the epoch private key and the ephemeral point, same HKDF, AES-GCM decrypt.","path":"web/crypto.js","lines":[92,100],"sha256":"d49470b25e4a47f13d468f3900f3db0288a1fd7d5dfcca58104491fb50a3bd37","excerpt":"// Owner side.\nasync function decryptReport(epochPrivateKey, envelope) {\n  const ephemeralPublic = await importPublicPoint(envelope.slice(0, 65));\n  const nonce = envelope.slice(65, 77);\n  const ct = envelope.slice(77);\n  const shared = await crypto.subtle.deriveBits({ name: 'ECDH', public: ephemeralPublic }, epochPrivateKey, 256);\n  const aes = await aesKeyFromSharedSecret(shared);\n  const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, aes, ct);\n  return JSON.parse(new TextDecoder().decode(plaintext));"},{"id":"common-api","kind":"code","label":"Every request from the tab","detail":"api(): fetch with optional JSON body and extra headers; returns ok, status, headers and parsed JSON.","path":"web/common.js","lines":[22,31],"sha256":"1c0a655431929443373cabb98c23179fc56fd3aa8cd6954f54c02814b4c1be41","excerpt":"async function api(method, path, body, headers = {}) {\n  const res = await fetch(path, {\n    method,\n    headers: body ? { 'Content-Type': 'application/json', ...headers } : headers,\n    body: body ? JSON.stringify(body) : undefined,\n  });\n  const text = await res.text();\n  let json = null;\n  try { json = text ? JSON.parse(text) : null; } catch { /* not json */ }\n  return { ok: res.ok, status: res.status, headers: res.headers, json, text };"},{"id":"index-page","kind":"code","label":"The page's markup","detail":"Header with served-by and leader, the field with the server box, the legend, the log panel with the kill button.","path":"web/index.html","lines":[15,37],"sha256":"6570a13ce2cb10d84ee17b49c4435ee1297c72a7517dd43e8bb22f19274ece6a","excerpt":"  \u003cheader class=\"top\"\u003e\n    \u003ch1\u003ebeacon \u003cspan class=\"sub\"\u003eFind My at toy scale. Nothing to do: watch for a minute.\u003c/span\u003e\u003c/h1\u003e\n    \u003cspan class=\"replica\" id=\"replica\"\u003econnecting\u003c/span\u003e\n  \u003c/header\u003e\n  \u003cmain class=\"layout\"\u003e\n    \u003csection class=\"stage\"\u003e\n      \u003cdiv class=\"field\" id=\"field\" title=\"click to drop one more item\"\u003e\n        \u003cdiv class=\"server\" id=\"server\"\u003e🗄️\u003cdiv class=\"label\"\u003eserver\u003cbr\u003e\u003cspan class=\"status\" id=\"server-note\"\u003estores key hashes and ciphertext\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n      \u003c/div\u003e\n      \u003cp class=\"legend\"\u003e\n        🎒🔑🚲 lost items, each with its own seed in this tab · 📱 finders, one of them \u003cspan class=\"spam\"\u003espammy\u003c/span\u003e · 🏠 the owner, decrypting here ·\n        📍 last seen · keys rotate every \u003cstrong id=\"epoch-len\"\u003e60\u003c/strong\u003e s in this demo, real Find My rotates every 15 min.\n        Click the field to drop one more item.\n      \u003c/p\u003e\n      \u003cp class=\"counts status\" id=\"counts\"\u003e\u003c/p\u003e\n    \u003c/section\u003e\n    \u003caside class=\"panel\"\u003e\n      \u003cdiv class=\"panel-head\"\u003e\n        \u003cstrong\u003eserver log\u003c/strong\u003e\n        \u003cbutton id=\"kill\" class=\"secondary\" title=\"stops the leader replica; pm2 restarts it in about 15 s and the other replica takes the latch\"\u003ekill the leader\u003c/button\u003e\n      \u003c/div\u003e\n      \u003cpre class=\"log\" id=\"log\"\u003e\u003c/pre\u003e\n      \u003cp class=\"status\"\u003eboth replicas stream their own lines over SSE; the first letter is the replica.\u003c/p\u003e"},{"id":"fwd-header","kind":"code","label":"Why the forwarder exists","detail":"One hostname, two replicas; finder affinity by cookie or header so a per-replica token bucket sees every report; a fleet's load balancer does the same with a session-affinity rule.","path":"forwarder.js","lines":[1,6],"sha256":"91fc567c435ddbc1ae2ef23eb5f339076183cd0650fa365e17d5cd638ee1ff9a","excerpt":"// The hostname beacon.amayz.dev maps to one port. This forwarder listens there and spreads requests across\n// the two Java replicas, skipping one that refuses connections. A request that carries a finder cookie\n// always lands on the same replica (hash of the cookie), so the per-finder token bucket, which lives in\n// that replica's memory, counts every report from that finder. Everything else round-robins. Fifty lines\n// of Node so the leader election has two real processes to elect between; a fleet's load balancer does\n// the same job with a session-affinity rule."},{"id":"fwd-pick","kind":"code","label":"pick(): ?replica=, else hash of the finder id, else round-robin","detail":"The affinity rule. The hash is h*31 + char code over the id, unsigned, mod 2.","path":"forwarder.js","lines":[17,26],"sha256":"91fc567c435ddbc1ae2ef23eb5f339076183cd0650fa365e17d5cd638ee1ff9a","excerpt":"// ?replica=A|B pins a request (the page opens one log stream per replica and kills the leader by id).\n// A finder id (header, else cookie) pins by hash so its token bucket sees every report. Else round-robin.\nfunction pick(req) {\n  const q = /[?\u0026]replica=([AB])\\b/.exec(req.url || '');\n  if (q) return TARGETS.find(t =\u003e t.id === q[1]);\n  const finder = req.headers['x-beacon-finder'] || (/(?:^|;\\s*)beacon_finder=([A-Za-z0-9_-]{22})/.exec(req.headers.cookie || '') || [])[1];\n  if (!finder) return TARGETS[next++ % TARGETS.length];\n  let h = 0;\n  for (const c of finder) h = (h * 31 + c.charCodeAt(0)) \u003e\u003e\u003e 0;\n  return TARGETS[h % TARGETS.length];"},{"id":"fwd-retry","kind":"code","label":"Failover for unpinned requests","detail":"ECONNREFUSED or ECONNRESET on the first attempt retries once on the other replica unless the request carried ?replica=; otherwise 503.","path":"forwarder.js","lines":[36,45],"sha256":"91fc567c435ddbc1ae2ef23eb5f339076183cd0650fa365e17d5cd638ee1ff9a","excerpt":"  upstream.on('error', err =\u003e {\n    const other = TARGETS[(TARGETS.indexOf(target) + 1) % TARGETS.length];\n    const pinned = /[?\u0026]replica=[AB]\\b/.test(req.url || '');\n    if (attempt === 0 \u0026\u0026 !pinned \u0026\u0026 (err.code === 'ECONNREFUSED' || err.code === 'ECONNRESET')) {\n      console.log(`[Forwarder] replica ${target.id} ${err.code}, retrying on ${other.id}`);\n      return forward(req, res, other, 1);\n    }\n    console.log(`[Forwarder] no replica answered ${req.method} ${req.url}: ${err.code}`);\n    if (!res.headersSent) res.writeHead(503, { 'content-type': 'application/json' });\n    res.end(JSON.stringify({ error: 'no replica available' }));"},{"id":"ecosystem","kind":"code","label":"Three pm2 processes","detail":"beacon.amayz.dev is the forwarder, beacon-a and beacon-b run run.sh A and B.","path":"ecosystem.config.js","lines":[5,34],"sha256":"ee4b090ae261858730226dafd32b78fe3e3bd48f138d34b71ba1b123a2a5e193","excerpt":"// Three processes: the forwarder on the public port and two Java replicas behind it.\n// pm2 stop beacon-a is the leader failover test in the README.\nconst shared = {\n  log_date_format: \"YYYY-MM-DD HH:mm:ss Z\",\n  cwd: __dirname,\n  watch: false\n};\n\nmodule.exports = {\n  apps: [\n    {\n      ...shared,\n      name,\n      script: 'forwarder.js',\n      out_file: `../prod-logs/${name}-out.log`,\n      error_file: `../prod-logs/${name}-error.log`\n    },\n    {\n      ...shared,\n      name: 'beacon-a',\n      script: './run.sh',\n      args: 'A',\n      out_file: `../prod-logs/beacon-a-out.log`,\n      error_file: `../prod-logs/beacon-a-error.log`\n    },\n    {\n      ...shared,\n      name: 'beacon-b',\n      script: './run.sh',\n      args: 'B',"},{"id":"run-sh","kind":"code","label":"run.sh copies the jar per replica and execs the JVM","detail":"exec means pm2's SIGINT reaches the JVM's shutdown hook; the copy makes a rebuild safe under a running replica.","path":"run.sh","lines":[13,19],"sha256":"8c451979f73acfd103287d2e0c32dec54a2953f89d0f7e9369e75685c98b11e7","excerpt":"# Run a private copy of the jar. A JVM loads classes lazily from the open jar file, so a rebuild that\n# overwrites build/libs/*.jar under a running replica makes its next class load fail (NoClassDefFoundError\n# in the shutdown hook was how this surfaced). The copy makes rebuilds safe while replicas run.\nJAR=\"$(ls build/libs/beacon-*.jar | head -1)\"\nmkdir -p build/run\ncp \"$JAR\" \"build/run/beacon-${REPLICA}.jar\"\nexec \"$JAVA\" -Xms256m -Xmx512m -XX:+UseZGC -jar \"build/run/beacon-${REPLICA}.jar\""},{"id":"main-virtual","kind":"code","label":"Jetty serves every request on a virtual thread","detail":"config.useVirtualThreads = true; web/ is served from disk in the checkout, from the jar otherwise.","path":"src/main/java/dev/amayz/beacon/Main.java","lines":[19,22],"sha256":"77388a65217a4eee09fc1f0a1c856ab054d8ce0fb224c26d9f736358da247abc","excerpt":"        Javalin app = Javalin.create(config -\u003e {\n            config.showJavalinBanner = false;\n            config.useVirtualThreads = true; // Jetty handles each request on a virtual thread: a blocked fetch parks, it does not pin a pool thread\n            config.http.defaultContentType = \"application/json\";"},{"id":"main-health","kind":"code","label":"/health","detail":"Replica id, epoch and epoch length, the CqlSession count, leader and isLeader, the ZooKeeper connection state.","path":"src/main/java/dev/amayz/beacon/Main.java","lines":[34,43],"sha256":"77388a65217a4eee09fc1f0a1c856ab054d8ce0fb224c26d9f736358da247abc","excerpt":"        app.get(\"/health\", ctx -\u003e ctx.json(Map.of(\n                \"ok\", true,\n                \"replica\", replica,\n                \"epoch\", Epochs.current(),\n                \"epochSeconds\", Epochs.SECONDS,\n                \"cassandraSessions\", Cassandra.CONNECTS.get(),\n                \"leader\", Leader.current(),\n                \"isLeader\", Leader.isLeader(),\n                \"zookeeper\", Zk.client().getZookeeperClient().isConnected() ? \"connected\" : \"disconnected\",\n                \"uptimeSeconds\", java.lang.management.ManagementFactory.getRuntimeMXBean().getUptime() / 1000"},{"id":"main-boot","kind":"code","label":"Route wiring and the [Boot] line","detail":"Every route touches both holders while wiring; after start the log records CqlSession holder=1 of 1 and Curator holder=1 of 1.","path":"src/main/java/dev/amayz/beacon/Main.java","lines":[46,58],"sha256":"77388a65217a4eee09fc1f0a1c856ab054d8ce0fb224c26d9f736358da247abc","excerpt":"        Api.routes(app, new CassandraStore());\n        Stats.routes(app);\n        LogStream.routes(app);\n        Chaos.routes(app, replica);\n\n        Leader.start(replica);\n        Sweeper.start(replica);\n\n        app.start(\"0.0.0.0\", port);\n        Log.out(\"[Main] replica=%s listening on :%d\", replica, port);\n        // The singleton, on record: every route above already touched both holders, and each was built once.\n        Log.out(\"[Boot] replica %s · CqlSession holder=%d of 1 · Curator holder=%d of 1 · epoch %d s\",\n                replica, Cassandra.CONNECTS.get(), Zk.CONNECTS.get(), Epochs.SECONDS);"},{"id":"main-shutdown","kind":"code","label":"The shutdown hook","detail":"Release the latch first, then close the ZooKeeper client, then stop Jetty. pm2 stop and System.exit both land here.","path":"src/main/java/dev/amayz/beacon/Main.java","lines":[60,67],"sha256":"77388a65217a4eee09fc1f0a1c856ab054d8ce0fb224c26d9f736358da247abc","excerpt":"        // pm2 stop sends SIGINT; run.sh execs the JVM so it lands here. Release the latch first: a graceful\n        // stop hands leadership over in well under a second, a kill -9 waits for the ZooKeeper session timeout.\n        Runtime.getRuntime().addShutdownHook(new Thread(() -\u003e {\n            Log.out(\"[Main] replica=%s shutting down\", replica);\n            Leader.stop();\n            Zk.client().close();\n            app.stop();\n        }, \"shutdown\"));"},{"id":"api-routes","kind":"code","label":"The five routes and the rate-limit before-handler","detail":"POST and GET /api/schedules, a before-handler on POST /api/reports, POST and GET /api/reports, /api/whereami.","path":"src/main/java/dev/amayz/beacon/Api.java","lines":[33,39],"sha256":"0db7e702bf4cb85953ad8f39686bc6b74b6baa8996af8ae9c8dcfecef1cdb8af","excerpt":"    static void routes(Javalin app, Store store) {\n        app.post(\"/api/schedules/{shareId}\", ctx -\u003e publish(ctx, store));\n        app.get(\"/api/schedules/{shareId}/current\", ctx -\u003e current(ctx, store));\n        app.before(\"/api/reports\", ctx -\u003e { if (ctx.method() == io.javalin.http.HandlerType.POST) RateLimit.check(ctx); });\n        app.post(\"/api/reports\", ctx -\u003e report(ctx, store));\n        app.get(\"/api/reports\", ctx -\u003e fetch(ctx, store));\n        app.get(\"/api/whereami\", Api::whereami);"},{"id":"api-limits","kind":"code","label":"Envelope size limits","detail":"MIN_CIPHERTEXT 93 = ephemeral point 65 + nonce 12 + GCM tag 16; MAX 2048.","path":"src/main/java/dev/amayz/beacon/Api.java","lines":[29,31],"sha256":"0db7e702bf4cb85953ad8f39686bc6b74b6baa8996af8ae9c8dcfecef1cdb8af","excerpt":"    /** ephemeral public key (65) + GCM nonce (12) + GCM tag (16): the smallest possible envelope. */\n    static final int MIN_CIPHERTEXT = 93;\n    static final int MAX_CIPHERTEXT = 2048;"},{"id":"api-publish","kind":"code","label":"Api.publish","detail":"Validates 1..98 keys, each epoch inside now-1..now+97, each public key a 65-byte uncompressed point; one putSchedule.","path":"src/main/java/dev/amayz/beacon/Api.java","lines":[48,70],"sha256":"0db7e702bf4cb85953ad8f39686bc6b74b6baa8996af8ae9c8dcfecef1cdb8af","excerpt":"    /** Owner publishes the public key for each of the next epochs. Idempotent; called every 15 minutes while the tab is open. */\n    private static void publish(Context ctx, Store store) {\n        String shareId = shareId(ctx);\n        JsonNode body = ctx.bodyAsClass(JsonNode.class);\n        JsonNode keys = body.path(\"keys\");\n        if (!keys.isArray() || keys.isEmpty() || keys.size() \u003e MAX_KEYS_PER_PUBLISH) {\n            throw new BadRequestResponse(\"keys must be 1..\" + MAX_KEYS_PER_PUBLISH + \" entries\");\n        }\n        long now = Epochs.current();\n        List\u003cStore.PublishedKey\u003e parsed = new ArrayList\u003c\u003e();\n        for (JsonNode k : keys) {\n            long epoch = k.path(\"epoch\").asLong(-1);\n            if (epoch \u003c now - 1 || epoch \u003e now + Epochs.PUBLISHED_AHEAD + 1) {\n                throw new BadRequestResponse(\"epoch \" + epoch + \" is outside the publishable window around \" + now);\n            }\n            byte[] pub = decode(k.path(\"publicKey\").asText(\"\"), \"publicKey\");\n            if (pub.length != 65 || pub[0] != 0x04) throw new BadRequestResponse(\"publicKey must be a 65-byte uncompressed P-256 point\");\n            parsed.add(new Store.PublishedKey(epoch, pub));\n        }\n        store.putSchedule(shareId, parsed);\n        Log.out(\"[Schedule] share=%s keys=%d epochs=%d..%d\", shareId, parsed.size(),\n                parsed.get(0).epoch(), parsed.get(parsed.size() - 1).epoch());\n        ctx.status(201).json(Map.of(\"shareId\", shareId, \"stored\", parsed.size(), \"epoch\", now));"},{"id":"api-current","kind":"code","label":"GET /api/schedules/:shareId/current","detail":"The route a finder in another tab would call; the simulation does not.","path":"src/main/java/dev/amayz/beacon/Api.java","lines":[73,86],"sha256":"0db7e702bf4cb85953ad8f39686bc6b74b6baa8996af8ae9c8dcfecef1cdb8af","excerpt":"    /** Finder asks for the key of the current epoch. The answer is a public key: safe to hand to anyone. */\n    private static void current(Context ctx, Store store) {\n        String shareId = shareId(ctx);\n        long epoch = Epochs.current();\n        var key = store.keyFor(shareId, epoch);\n        if (key.isEmpty()) {\n            ctx.status(404).json(Map.of(\"error\", \"no key published for this share id and epoch\", \"epoch\", epoch));\n            return;\n        }\n        ctx.json(Map.of(\n                \"shareId\", shareId,\n                \"epoch\", epoch,\n                \"epochSeconds\", Epochs.SECONDS,\n                \"publicKey\", encode(key.get().publicKey())"},{"id":"api-report","kind":"code","label":"Api.report","detail":"keyHash must be a 43-character base64url SHA-256, ciphertext 93..2048 bytes; putReport; the [Report] log line names the key hash; 201.","path":"src/main/java/dev/amayz/beacon/Api.java","lines":[90,102],"sha256":"0db7e702bf4cb85953ad8f39686bc6b74b6baa8996af8ae9c8dcfecef1cdb8af","excerpt":"    /** Finder posts an opaque envelope under the hash of the key it encrypted to. */\n    private static void report(Context ctx, Store store) {\n        JsonNode body = ctx.bodyAsClass(JsonNode.class);\n        String keyHash = body.path(\"keyHash\").asText(\"\");\n        if (!KEY_HASH.matcher(keyHash).matches()) throw new BadRequestResponse(\"keyHash must be a base64url SHA-256\");\n        byte[] ciphertext = decode(body.path(\"ciphertext\").asText(\"\"), \"ciphertext\");\n        if (ciphertext.length \u003c MIN_CIPHERTEXT || ciphertext.length \u003e MAX_CIPHERTEXT) {\n            throw new BadRequestResponse(\"ciphertext must be \" + MIN_CIPHERTEXT + \"..\" + MAX_CIPHERTEXT + \" bytes\");\n        }\n        store.putReport(decode(keyHash, \"keyHash\"), ciphertext);\n        Log.out(\"[Report] %s · %d B of ciphertext stored under key hash %s… · ip %s\",\n                RateLimit.finderName(ctx), ciphertext.length, keyHash.substring(0, 8), clientIp(ctx));\n        ctx.status(201).json(Map.of(\"stored\", true, \"bytes\", ciphertext.length));"},{"id":"api-fetch","kind":"code","label":"Api.fetch","detail":"1..98 h= parameters, each a key hash; store.reports; the [Fetch] log line with the elapsed milliseconds and whether the thread is virtual.","path":"src/main/java/dev/amayz/beacon/Api.java","lines":[105,124],"sha256":"0db7e702bf4cb85953ad8f39686bc6b74b6baa8996af8ae9c8dcfecef1cdb8af","excerpt":"    /** Owner fetches by key hash, one hash per epoch it wants to check. */\n    private static void fetch(Context ctx, Store store) {\n        List\u003cString\u003e hashes = ctx.queryParams(\"h\");\n        if (hashes.isEmpty() || hashes.size() \u003e MAX_HASHES_PER_FETCH) {\n            throw new BadRequestResponse(\"pass 1..\" + MAX_HASHES_PER_FETCH + \" h= parameters\");\n        }\n        for (String h : hashes) if (!KEY_HASH.matcher(h).matches()) throw new BadRequestResponse(\"bad key hash \" + h);\n        long started = System.nanoTime();\n        Map\u003cString, List\u003cStore.Report\u003e\u003e found = store.reports(hashes);\n        Map\u003cString, List\u003cMap\u003cString, String\u003e\u003e\u003e out = new HashMap\u003c\u003e();\n        int total = 0;\n        for (var e : found.entrySet()) {\n            List\u003cMap\u003cString, String\u003e\u003e list = new ArrayList\u003c\u003e();\n            for (Store.Report r : e.getValue()) list.add(Map.of(\"ts\", r.ts(), \"ciphertext\", encode(r.ciphertext())));\n            out.put(e.getKey(), list);\n            total += list.size();\n        }\n        Log.out(\"[Fetch] %d key hashes in %d ms on %s threads · %d reports found\", hashes.size(),\n                (System.nanoTime() - started) / 1_000_000, Thread.currentThread().isVirtual() ? \"virtual\" : \"platform\", total);\n        ctx.json(out);"},{"id":"cass-holder","kind":"code","label":"The CqlSession holder singleton","detail":"Initialization-on-demand holder: the JVM initializes Holder once, under the class-init lock, the first time session() runs.","path":"src/main/java/dev/amayz/beacon/Cassandra.java","lines":[25,34],"sha256":"37a5d18aad72935ba432bd7122868f7d70a21340da96afc9d7d26ee21dfd9264","excerpt":"     * Initialization-on-demand holder. The JVM initializes a class exactly once, under its own lock, the first\n     * time something touches it. Holder is not touched until session() runs, so the session is lazy, and no\n     * caller after the first ever takes a lock. SingletonTest hits this from 64 threads at once.\n     */\n    private static final class Holder {\n        static final CqlSession INSTANCE = connect();\n    }\n\n    static CqlSession session() {\n        return Holder.INSTANCE;"},{"id":"cass-connect","kind":"code","label":"connect(): one session, LOCAL_QUORUM","detail":"CONNECTS counts each build (anything above one is a bug); 10 s request timeout; schema applied at boot.","path":"src/main/java/dev/amayz/beacon/Cassandra.java","lines":[37,53],"sha256":"37a5d18aad72935ba432bd7122868f7d70a21340da96afc9d7d26ee21dfd9264","excerpt":"    static CqlSession connect() {\n        String host = Main.env(\"CASSANDRA_HOST\", \"127.0.0.1\");\n        int port = Integer.parseInt(Main.env(\"CASSANDRA_PORT\", \"9042\"));\n        CONNECTS.incrementAndGet();\n        Log.out(\"[Cassandra] connecting to %s:%d\", host, port);\n        DriverConfigLoader config = DriverConfigLoader.programmaticBuilder()\n                .withDuration(DefaultDriverOption.REQUEST_TIMEOUT, Duration.ofSeconds(10))\n                .withString(DefaultDriverOption.REQUEST_CONSISTENCY, \"LOCAL_QUORUM\")\n                .build();\n        CqlSession bootstrap = CqlSession.builder()\n                .addContactPoint(new InetSocketAddress(host, port))\n                .withLocalDatacenter(Main.env(\"CASSANDRA_DC\", \"datacenter1\"))\n                .withConfigLoader(config)\n                .build();\n        applySchema(bootstrap);\n        Log.out(\"[Cassandra] connected, schema applied\");\n        return bootstrap;"},{"id":"store-prepare","kind":"code","label":"Prepared statements on the one session","detail":"CassandraStore prepares four statements on Cassandra.session(); reads return the newest 50 per hash.","path":"src/main/java/dev/amayz/beacon/CassandraStore.java","lines":[37,42],"sha256":"2a643f4993e09b3b2571b53204259bbc1dc2fd1974c8e761987de52d7e14d66d","excerpt":"    CassandraStore() {\n        CqlSession s = Cassandra.session();\n        insertKey = s.prepare(\"INSERT INTO beacon.schedules (share_id, epoch, public_key) VALUES (?, ?, ?)\");\n        selectKey = s.prepare(\"SELECT public_key FROM beacon.schedules WHERE share_id = ? AND epoch = ?\");\n        insertReport = s.prepare(\"INSERT INTO beacon.reports (key_hash, ts, ciphertext) VALUES (?, ?, ?)\");\n        selectReports = s.prepare(\"SELECT ts, ciphertext FROM beacon.reports WHERE key_hash = ? LIMIT \" + REPORTS_PER_HASH);"},{"id":"store-putschedule","kind":"code","label":"putSchedule: one unlogged batch","detail":"All rows share the share_id partition, so the batch is one write to one node.","path":"src/main/java/dev/amayz/beacon/CassandraStore.java","lines":[46,52],"sha256":"2a643f4993e09b3b2571b53204259bbc1dc2fd1974c8e761987de52d7e14d66d","excerpt":"    public void putSchedule(String shareId, List\u003cPublishedKey\u003e keys) {\n        // All rows share one partition (share_id), so an unlogged batch is one write to one node, not 97.\n        BatchStatement batch = BatchStatement.newInstance(BatchType.UNLOGGED);\n        for (PublishedKey key : keys) {\n            batch = batch.add(insertKey.bind(shareId, key.epoch(), ByteBuffer.wrap(key.publicKey())));\n        }\n        Cassandra.session().execute(batch);"},{"id":"store-putreport","kind":"code","label":"putReport: one INSERT with a timeuuid","detail":"The TTL comes from the table default (7 days); the timeuuid gives newest-first order.","path":"src/main/java/dev/amayz/beacon/CassandraStore.java","lines":[63,65],"sha256":"2a643f4993e09b3b2571b53204259bbc1dc2fd1974c8e761987de52d7e14d66d","excerpt":"    public void putReport(byte[] keyHash, byte[] ciphertext) {\n        // The row's TTL comes from the table default (7 days). timeuuid gives newest-first order for free.\n        Cassandra.session().execute(insertReport.bind(ByteBuffer.wrap(keyHash), Uuids.timeBased(), ByteBuffer.wrap(ciphertext)));"},{"id":"store-reports","kind":"code","label":"reports(): the virtual-thread fan-out","detail":"One Callable per hash, newVirtualThreadPerTaskExecutor in try-with-resources, invokeAll keeps order and rethrows the first failure.","path":"src/main/java/dev/amayz/beacon/CassandraStore.java","lines":[69,91],"sha256":"2a643f4993e09b3b2571b53204259bbc1dc2fd1974c8e761987de52d7e14d66d","excerpt":"     * One partition read per hash, all in flight at once. Virtual threads make blocking driver calls cheap\n     * to park: 97 tasks, 97 virtual threads, a handful of carrier threads. invokeAll keeps the answer order\n     * and rethrows the first failure. The executor is per call and closed by try-with-resources, so nothing\n     * leaks across requests.\n     */\n    @Override\n    public Map\u003cString, List\u003cReport\u003e\u003e reports(List\u003cString\u003e keyHashes) {\n        List\u003cCallable\u003cList\u003cReport\u003e\u003e\u003e tasks = new ArrayList\u003c\u003e();\n        for (String h : keyHashes) tasks.add(() -\u003e reportsFor(h));\n        Map\u003cString, List\u003cReport\u003e\u003e out = new LinkedHashMap\u003c\u003e();\n        try (ExecutorService fanOut = Executors.newVirtualThreadPerTaskExecutor()) {\n            List\u003cFuture\u003cList\u003cReport\u003e\u003e\u003e results = fanOut.invokeAll(tasks);\n            for (int i = 0; i \u003c keyHashes.size(); i++) {\n                List\u003cReport\u003e list = results.get(i).get();\n                if (!list.isEmpty()) out.put(keyHashes.get(i), list);\n            }\n        } catch (InterruptedException e) {\n            Thread.currentThread().interrupt();\n            throw new IllegalStateException(\"fetch interrupted\", e);\n        } catch (java.util.concurrent.ExecutionException e) {\n            throw new IllegalStateException(\"fetch failed: \" + e.getCause(), e.getCause());\n        }\n        return out;"},{"id":"store-reportsfor","kind":"code","label":"reportsFor(): one partition read","detail":"SELECT ... WHERE key_hash = ? LIMIT 50; each row's timeuuid becomes an ISO timestamp.","path":"src/main/java/dev/amayz/beacon/CassandraStore.java","lines":[94,99],"sha256":"2a643f4993e09b3b2571b53204259bbc1dc2fd1974c8e761987de52d7e14d66d","excerpt":"    List\u003cReport\u003e reportsFor(String keyHash) {\n        ByteBuffer hash = ByteBuffer.wrap(Base64.getUrlDecoder().decode(keyHash));\n        List\u003cReport\u003e list = new ArrayList\u003c\u003e();\n        for (Row row : Cassandra.session().execute(selectReports.bind(hash))) {\n            Instant at = Instant.ofEpochMilli(Uuids.unixTimestamp(row.getUuid(\"ts\")));\n            list.add(new Report(at.toString(), bytes(row.getByteBuffer(\"ciphertext\"))));"},{"id":"schema-reports","kind":"code","label":"The reports and schedules tables","detail":"reports: partition key_hash, clustering ts DESC, TTL 7 days. schedules: partition share_id, clustering epoch, TTL 48 h.","path":"schema.cql","lines":[8,24],"sha256":"38d3167ce11d334e13491cdf0b5a55f307b43dfa3b7bf7deb37d91e761cd65c8","excerpt":"-- One partition per public-key hash, rows ordered newest first. A 7-day TTL is set on every write\n-- so old sightings vanish without a delete job. Ciphertext is opaque to the server.\nCREATE TABLE IF NOT EXISTS beacon.reports (\n  key_hash   blob,\n  ts         timeuuid,\n  ciphertext blob,\n  PRIMARY KEY (key_hash, ts)\n) WITH CLUSTERING ORDER BY (ts DESC) AND default_time_to_live = 604800;\n\n-- One partition per share id, one row per 15-minute epoch, holding only the public key.\n-- 48-hour TTL: the owner republishes whenever the page is open, so a stale schedule fades out on its own.\nCREATE TABLE IF NOT EXISTS beacon.schedules (\n  share_id   text,\n  epoch      bigint,\n  public_key blob,\n  PRIMARY KEY (share_id, epoch)\n) WITH default_time_to_live = 172800;"},{"id":"schema-stats","kind":"code","label":"The stats table","detail":"One row per epoch, written by the elected sweeper, overwritten each sweep.","path":"schema.cql","lines":[26,33],"sha256":"38d3167ce11d334e13491cdf0b5a55f307b43dfa3b7bf7deb37d91e761cd65c8","excerpt":"-- Written by the elected sweeper every 30 seconds: how many reports landed in each 15-minute epoch, and\n-- which replica counted them. One row per epoch; the sweep overwrites it.\nCREATE TABLE IF NOT EXISTS beacon.stats (\n  epoch     bigint PRIMARY KEY,\n  reports   int,\n  swept_at  timestamp,\n  swept_by  text\n) WITH default_time_to_live = 604800;"},{"id":"singleton-test","kind":"code","label":"SingletonTest: 64 threads, one instance","detail":"Workers park on a CountDownLatch, are released together, and the distinct instances are counted; the production holder yields 1.","path":"src/test/java/dev/amayz/beacon/SingletonTest.java","lines":[24,60],"sha256":"04246f6b6095d636126109179068c21a95a2d7511dfba9a5a1ac0cd28a4c43db","excerpt":" * The interview question, run against production code: release 64 threads at the same instant and count how\n * many distinct instances come back. One is the only acceptable answer.\n */\nclass SingletonTest {\n\n    static final int THREADS = 64;\n\n    /** Park every worker at a gate, open it, collect what each one got. Set membership is identity. */\n    static \u003cT\u003e Set\u003cT\u003e hammer(Supplier\u003cT\u003e getInstance) throws Exception {\n        ExecutorService pool = Executors.newFixedThreadPool(THREADS);\n        CountDownLatch ready = new CountDownLatch(THREADS);\n        CountDownLatch go = new CountDownLatch(1);\n        try {\n            List\u003cFuture\u003cT\u003e\u003e results = new ArrayList\u003c\u003e();\n            for (int i = 0; i \u003c THREADS; i++) {\n                results.add(pool.submit(() -\u003e {\n                    ready.countDown();\n                    go.await();\n                    return getInstance.get();\n                }));\n            }\n            ready.await();\n            go.countDown();\n            Set\u003cT\u003e distinct = ConcurrentHashMap.newKeySet();\n            for (Future\u003cT\u003e f : results) distinct.add(f.get());\n            return distinct;\n        } finally {\n            pool.shutdownNow();\n        }\n    }\n\n    /** The production singleton: 64 threads ask for the CqlSession, exactly one connection is built. */\n    @Test\n    void cassandraSessionIsBuiltOnce() throws Exception {\n        assumeTrue(cassandraReachable(), \"needs the docker compose Cassandra on 127.0.0.1:9042\");\n        Set\u003cCqlSession\u003e sessions = hammer(Cassandra::session);\n        assertEquals(1, sessions.size(), \"distinct CqlSession instances\");"},{"id":"tb-header","kind":"code","label":"TokenBucket: what it is","detail":"Capacity tokens refilled at a steady rate, lazily on each call; one synchronized method is the whole concurrency story.","path":"src/main/java/dev/amayz/beacon/TokenBucket.java","lines":[6,8],"sha256":"0b2022c7efd57155aa88155f2b908d649b238ae4658f6bf2efcc2c972d06612d","excerpt":" * Token bucket: capacity tokens, refilled at a steady rate, refilled lazily on each call instead of by a timer.\n * One synchronized method is the whole concurrency story: the bucket is per finder, so contention is\n * one finder's own requests, and the critical section is a handful of arithmetic ops."},{"id":"tb-acquire","kind":"code","label":"tryAcquire and secondsUntilNextToken","detail":"Refill, then take one token if there is one; Retry-After is ceil((1 - tokens) / refillPerSecond).","path":"src/main/java/dev/amayz/beacon/TokenBucket.java","lines":[31,45],"sha256":"0b2022c7efd57155aa88155f2b908d649b238ae4658f6bf2efcc2c972d06612d","excerpt":"    /** Take one token if there is one. */\n    synchronized boolean tryAcquire() {\n        refill();\n        if (tokens \u003e= 1) {\n            tokens -= 1;\n            return true;\n        }\n        return false;\n    }\n\n    /** Whole seconds until the next token exists: the Retry-After header. */\n    synchronized long secondsUntilNextToken() {\n        refill();\n        if (tokens \u003e= 1) return 0;\n        return (long) Math.ceil((1 - tokens) / refillPerSecond);"},{"id":"tb-refill","kind":"code","label":"Lazy refill","detail":"Credit the seconds elapsed since the last call, capped at capacity. No timer thread per bucket.","path":"src/main/java/dev/amayz/beacon/TokenBucket.java","lines":[58,64],"sha256":"0b2022c7efd57155aa88155f2b908d649b238ae4658f6bf2efcc2c972d06612d","excerpt":"    /** Lazy refill: credit the time elapsed since the last call. No timer thread per bucket. */\n    private void refill() {\n        long now = nanoClock.getAsLong();\n        double elapsedSeconds = (now - lastRefillNanos) / 1_000_000_000.0;\n        if (elapsedSeconds \u003e 0) {\n            tokens = Math.min(capacity, tokens + elapsedSeconds * refillPerSecond);\n            lastRefillNanos = now;"},{"id":"rl-header","kind":"code","label":"Two buckets per report, in-process","detail":"Finder bucket 10 / 1 per second; IP bucket 100 / 20 per second as a backstop wide enough that one spammy finder cannot starve its neighbours. Each replica counts on its own.","path":"src/main/java/dev/amayz/beacon/RateLimit.java","lines":[13,17],"sha256":"237b8ef76fb52f94290fe96ef311001069caf40623b73e1dbde59346a2038d8f","excerpt":" * Two buckets per report. The finder bucket (capacity 10, refill 1 per second) is the demo: a finder is the\n * X-Beacon-Finder header the page sends per sprite, or a cookie the server mints when there is none. The IP\n * bucket (capacity 100, refill 20 per second) is a coarse backstop for a whole browser or NAT, wide enough\n * that one spammy finder cannot starve the five well-behaved ones next to it. In-process, so each replica\n * counts on its own; the README says what changes in a fleet."},{"id":"rl-finderid","kind":"code","label":"finderId(): header, else cookie, else mint a cookie","detail":"The 22-character X-Beacon-Finder header wins; with none, the replica mints a 30-day beacon_finder cookie.","path":"src/main/java/dev/amayz/beacon/RateLimit.java","lines":[35,49],"sha256":"237b8ef76fb52f94290fe96ef311001069caf40623b73e1dbde59346a2038d8f","excerpt":"    /** The finder id: the header the page sends per sprite, else a cookie, minted here when there is none. */\n    static String finderId(Context ctx) {\n        String header = ctx.header(HEADER);\n        if (header != null \u0026\u0026 header.matches(\"^[A-Za-z0-9_-]{22}$\")) return header;\n        String id = ctx.cookie(COOKIE);\n        if (id == null || !id.matches(\"^[A-Za-z0-9_-]{22}$\")) {\n            byte[] bytes = new byte[16];\n            RANDOM.nextBytes(bytes);\n            id = Base64.getUrlEncoder().withoutPadding().encodeToString(bytes);\n            Cookie cookie = new Cookie(COOKIE, id);\n            cookie.setHttpOnly(true);\n            cookie.setSameSite(SameSite.LAX);\n            cookie.setPath(\"/\");\n            cookie.setMaxAge(60 * 60 * 24 * 30);\n            ctx.cookie(cookie);"},{"id":"rl-check","kind":"code","label":"RateLimit.check","detail":"Look up both buckets, ask both for secondsUntilNextToken first so a rejection burns no token in the other, then tryAcquire; on failure 429 with Retry-After and skipRemainingHandlers.","path":"src/main/java/dev/amayz/beacon/RateLimit.java","lines":[62,75],"sha256":"237b8ef76fb52f94290fe96ef311001069caf40623b73e1dbde59346a2038d8f","excerpt":"    /** Runs before POST /api/reports. Ends the request with 429 and Retry-After when either bucket is empty. */\n    static void check(Context ctx) {\n        String finder = finderId(ctx);\n        String ip = Api.clientIp(ctx);\n        TokenBucket byFinder = bucket(\"finder:\" + finder, CAPACITY, REFILL_PER_SECOND);\n        TokenBucket byIp = bucket(\"ip:\" + ip, IP_CAPACITY, IP_REFILL_PER_SECOND);\n        // Ask the IP bucket first so a rejected finder does not also burn an IP token, and vice versa.\n        long retryAfter = Math.max(byFinder.secondsUntilNextToken(), byIp.secondsUntilNextToken());\n        if (retryAfter \u003e 0 || !byFinder.tryAcquire() || !byIp.tryAcquire()) {\n            retryAfter = Math.max(1, Math.max(byFinder.secondsUntilNextToken(), byIp.secondsUntilNextToken()));\n            logRejection(finder, finderName(ctx), ip, retryAfter, byFinder, byIp);\n            ctx.status(429).header(\"Retry-After\", Long.toString(retryAfter))\n               .json(Map.of(\"error\", \"rate limited\", \"retryAfterSeconds\", retryAfter));\n            ctx.skipRemainingHandlers();"},{"id":"rl-log","kind":"code","label":"One [RateLimit] line per finder per second","detail":"Rejections within the same second are counted and folded into \"(+N more 429s this second)\".","path":"src/main/java/dev/amayz/beacon/RateLimit.java","lines":[79,92],"sha256":"237b8ef76fb52f94290fe96ef311001069caf40623b73e1dbde59346a2038d8f","excerpt":"    /** A spammy finder is rejected 20 times a second; log once a second per finder with the count, so the log stays readable. */\n    private static final Map\u003cString, long[]\u003e REJECTIONS = new ConcurrentHashMap\u003c\u003e(); // finder -\u003e {secondLogged, suppressed}\n\n    private static void logRejection(String finder, String name, String ip, long retryAfter, TokenBucket byFinder, TokenBucket byIp) {\n        long second = System.currentTimeMillis() / 1000;\n        long[] state = REJECTIONS.computeIfAbsent(finder, k -\u003e new long[]{0, 0});\n        synchronized (state) {\n            if (state[0] == second) { state[1]++; return; }\n            long suppressed = state[1];\n            state[0] = second;\n            state[1] = 0;\n            Log.out(\"[RateLimit] %s throttled · %.1f/%d tokens, ip %.0f/%d · 429 retry in %d s%s\",\n                    name, byFinder.tokens(), CAPACITY, byIp.tokens(), IP_CAPACITY, retryAfter,\n                    suppressed \u003e 0 ? \" (+\" + suppressed + \" more 429s this second)\" : \"\");"},{"id":"zk-holder","kind":"code","label":"The Curator holder singleton","detail":"Same holder idiom as Cassandra; one CuratorFramework owns the ZooKeeper session: 6 s session timeout, namespace beacon.","path":"src/main/java/dev/amayz/beacon/Zk.java","lines":[7,33],"sha256":"cc87b4cf9ce408e1c709e7b99e8629ee803ef4e1d10133ce85144632c8449b53","excerpt":"/** One CuratorFramework per process, the same holder pattern as Cassandra. It owns the ZooKeeper session. */\nfinal class Zk {\n    private Zk() {}\n\n    /** How many Curator clients this process has built. Anything above one is a bug. */\n    static final java.util.concurrent.atomic.AtomicInteger CONNECTS = new java.util.concurrent.atomic.AtomicInteger();\n\n    private static final class Holder {\n        static final CuratorFramework INSTANCE = connect();\n    }\n\n    static CuratorFramework client() {\n        return Holder.INSTANCE;\n    }\n\n    private static CuratorFramework connect() {\n        String connect = Main.env(\"ZK_CONNECT\", \"127.0.0.1:2181\");\n        CONNECTS.incrementAndGet();\n        Log.out(\"[Zk] connecting to %s\", connect);\n        CuratorFramework client = CuratorFrameworkFactory.builder()\n                .connectString(connect)\n                .sessionTimeoutMs(6_000)\n                .connectionTimeoutMs(5_000)\n                .retryPolicy(new ExponentialBackoffRetry(500, 5))\n                .namespace(\"beacon\")\n                .build();\n        client.start();"},{"id":"leader-start","kind":"code","label":"LeaderLatch on /beacon/leader","detail":"Each replica adds an ephemeral sequential node; the lowest is leader; the listener logs acquired and lost.","path":"src/main/java/dev/amayz/beacon/Leader.java","lines":[7,26],"sha256":"8c68b38a491377ba8d6df6e88341b64688ba665f074655248ab53ec96b50edc0","excerpt":" * Leader election with Curator's LeaderLatch on /beacon/leader. Every replica registers an ephemeral\n * sequential node; the lowest one is leader. When a replica's ZooKeeper session ends (crash, pm2 stop, a\n * long GC pause past the session timeout) its node vanishes and the next one takes over within seconds.\n */\nfinal class Leader {\n    private Leader() {}\n\n    static final String PATH = \"/leader\";\n\n    private static volatile LeaderLatch latch;\n\n    static void start(String replicaId) throws Exception {\n        LeaderLatch l = new LeaderLatch(Zk.client(), PATH, replicaId);\n        l.addListener(new LeaderLatchListener() {\n            @Override public void isLeader() { Log.out(\"[Leader] acquired by replica %s\", replicaId); }\n            @Override public void notLeader() { Log.out(\"[Leader] lost by replica %s\", replicaId); }\n        });\n        l.start();\n        latch = l;\n        Log.out(\"[Leader] replica %s joined the election at %s\", replicaId, PATH);"},{"id":"leader-stop","kind":"code","label":"Leader.stop(): release the latch now","detail":"Closing the latch deletes the ephemeral node at once instead of at session expiry.","path":"src/main/java/dev/amayz/beacon/Leader.java","lines":[29,35],"sha256":"8c68b38a491377ba8d6df6e88341b64688ba665f074655248ab53ec96b50edc0","excerpt":"    /** Close the latch on shutdown so the ephemeral node vanishes now, not when the session times out. */\n    static void stop() {\n        LeaderLatch l = latch;\n        if (l == null) return;\n        try {\n            l.close();\n            System.out.println(\"[Leader] latch released on shutdown\");"},{"id":"leader-isleader","kind":"code","label":"Leader.isLeader()","detail":"latch.hasLeadership(), read on every sweeper tick and by the chaos route.","path":"src/main/java/dev/amayz/beacon/Leader.java","lines":[41,43],"sha256":"8c68b38a491377ba8d6df6e88341b64688ba665f074655248ab53ec96b50edc0","excerpt":"    static boolean isLeader() {\n        LeaderLatch l = latch;\n        return l != null \u0026\u0026 l.hasLeadership();"},{"id":"sweeper-timer","kind":"code","label":"The sweeper's timer","detail":"A single daemon thread named sweeper; tick at 5 s, then every 30 s, on both replicas.","path":"src/main/java/dev/amayz/beacon/Sweeper.java","lines":[17,33],"sha256":"0a2e599e717bacc65181aaad26dee01e87335428ed91e51960bec43901c1e75a","excerpt":" * The job that must run on exactly one replica: every 30 seconds, count reports per epoch into the stats\n * table. Both replicas tick; only the one holding the leader latch does the work. A full scan of reports is\n * fine at toy scale and is called out in the README as the thing that changes first in a fleet.\n */\nfinal class Sweeper {\n    private Sweeper() {}\n\n    static final long PERIOD_SECONDS = 30;\n\n    private static final ScheduledExecutorService TIMER = Executors.newSingleThreadScheduledExecutor(r -\u003e {\n        Thread t = new Thread(r, \"sweeper\");\n        t.setDaemon(true);\n        return t;\n    });\n\n    static void start(String replicaId) {\n        TIMER.scheduleAtFixedRate(() -\u003e tick(replicaId), 5, PERIOD_SECONDS, TimeUnit.SECONDS);"},{"id":"sweeper-tick","kind":"code","label":"tick(): leader does the work, follower logs a skip","detail":"isLeader() gates the scan; the [Sweep] line reports the count, the epochs and the milliseconds.","path":"src/main/java/dev/amayz/beacon/Sweeper.java","lines":[36,49],"sha256":"0a2e599e717bacc65181aaad26dee01e87335428ed91e51960bec43901c1e75a","excerpt":"    private static void tick(String replicaId) {\n        try {\n            if (!Leader.isLeader()) {\n                Log.out(\"[Sweep] skipped on replica %s, leader is %s\", replicaId, Leader.current());\n                return;\n            }\n            long started = System.nanoTime();\n            Map\u003cLong, Integer\u003e perEpoch = countPerEpoch();\n            writeStats(perEpoch, replicaId);\n            int total = perEpoch.values().stream().mapToInt(Integer::intValue).sum();\n            Log.out(\"[Sweep] replica %s counted %d reports across %d epochs in %d ms\",\n                    replicaId, total, perEpoch.size(), (System.nanoTime() - started) / 1_000_000);\n        } catch (Exception e) {\n            Log.out(\"[Sweep] failed on replica %s: %s\", replicaId, e);"},{"id":"sweeper-count","kind":"code","label":"countPerEpoch and writeStats","detail":"SELECT ts FROM beacon.reports over the whole table, bucketed by epoch; one INSERT into beacon.stats per epoch with swept_by.","path":"src/main/java/dev/amayz/beacon/Sweeper.java","lines":[53,69],"sha256":"0a2e599e717bacc65181aaad26dee01e87335428ed91e51960bec43901c1e75a","excerpt":"    private static Map\u003cLong, Integer\u003e countPerEpoch() {\n        Map\u003cLong, Integer\u003e perEpoch = new TreeMap\u003c\u003e();\n        for (Row row : Cassandra.session().execute(\"SELECT ts FROM beacon.reports\")) {\n            long epoch = Epochs.at(Uuids.unixTimestamp(row.getUuid(\"ts\")));\n            perEpoch.merge(epoch, 1, Integer::sum);\n        }\n        return perEpoch;\n    }\n\n    private static final Map\u003cCqlSession, PreparedStatement\u003e UPSERT = new HashMap\u003c\u003e();\n\n    private static void writeStats(Map\u003cLong, Integer\u003e perEpoch, String replicaId) {\n        CqlSession s = Cassandra.session();\n        PreparedStatement upsert = UPSERT.computeIfAbsent(s,\n                k -\u003e k.prepare(\"INSERT INTO beacon.stats (epoch, reports, swept_at, swept_by) VALUES (?, ?, ?, ?)\"));\n        Instant now = Instant.now();\n        for (var e : perEpoch.entrySet()) s.execute(upsert.bind(e.getKey(), e.getValue(), now, replicaId));"},{"id":"chaos","kind":"code","label":"POST /api/chaos/kill-leader","detail":"409 unless this replica is the leader, 429 inside the 30 s cooldown shared by all visitors, else log, answer, and System.exit(0) 300 ms later on a daemon thread.","path":"src/main/java/dev/amayz/beacon/Chaos.java","lines":[9,39],"sha256":"39ff53325900d34f331e6448ad558f1d78b2501c5e156dd556351c6d7ae7008e","excerpt":" * The failover demo. POST /api/chaos/kill-leader on the leader replica exits the process; pm2 restarts it\n * about 15 seconds later (JVM boot plus the Cassandra connect), and in the meantime the other replica\n * acquires the latch. One kill per 30 seconds across all visitors, so the pair can never be flapped down.\n */\nfinal class Chaos {\n    private Chaos() {}\n\n    static final long COOLDOWN_MS = 30_000;\n    private static final AtomicLong LAST_KILL = new AtomicLong();\n\n    static void routes(Javalin app, String replica) {\n        app.post(\"/api/chaos/kill-leader\", ctx -\u003e {\n            if (!Leader.isLeader()) {\n                ctx.status(409).json(Map.of(\"error\", \"this replica is not the leader\", \"replica\", replica, \"leader\", Leader.current()));\n                return;\n            }\n            long now = System.currentTimeMillis();\n            long last = LAST_KILL.get();\n            if (now - last \u003c COOLDOWN_MS || !LAST_KILL.compareAndSet(last, now)) {\n                long wait = (COOLDOWN_MS - (now - last)) / 1000 + 1;\n                ctx.status(429).header(\"Retry-After\", Long.toString(wait)).json(Map.of(\"error\", \"one kill per 30 s\", \"retryAfterSeconds\", wait));\n                return;\n            }\n            Log.out(\"[Chaos] leader %s exiting on request from %s; pm2 restarts it\", replica, Api.clientIp(ctx));\n            ctx.json(Map.of(\"killed\", replica));\n            Thread t = new Thread(() -\u003e {\n                try { Thread.sleep(300); } catch (InterruptedException ignored) { }\n                System.exit(0);\n            }, \"chaos-exit\");\n            t.setDaemon(true);\n            t.start();"},{"id":"epochs","kind":"code","label":"Epochs","detail":"EPOCH_SECONDS (60 in the demo) from the environment; an epoch number is floor(ms / 1000 / SECONDS), shared by owner, finder and server.","path":"src/main/java/dev/amayz/beacon/Epochs.java","lines":[4,20],"sha256":"949e1a7eb7eac23355bd580d70073d95bc2e5b0a6bbcefa525a618d45e906891","excerpt":" * The item's key rotates once per epoch. Real Find My rotates every 15 minutes; the demo runs 60-second epochs\n * (EPOCH_SECONDS) so a visitor sees a rotation while watching. Epoch numbers are shared by owner, finder and server.\n */\nfinal class Epochs {\n    private Epochs() {}\n\n    static final long SECONDS = Long.parseLong(Main.env(\"EPOCH_SECONDS\", \"60\"));\n\n    /** How many future epochs an owner publishes: 96 epochs is 24 hours of keys. */\n    static final int PUBLISHED_AHEAD = 96;\n\n    static long current() {\n        return at(System.currentTimeMillis());\n    }\n\n    static long at(long epochMillis) {\n        return epochMillis / 1000 / SECONDS;"},{"id":"stats-route","kind":"code","label":"GET /api/stats","detail":"The read side of the sweeper: the last 8 epochs' rows. The page does not call it.","path":"src/main/java/dev/amayz/beacon/Stats.java","lines":[16,29],"sha256":"41d558657e0e55240cf161026ddbf32ce4495ae07bf88698d80a803e7b79a500","excerpt":"    static void routes(Javalin app) {\n        app.get(\"/api/stats\", ctx -\u003e {\n            long now = Epochs.current();\n            List\u003cLong\u003e epochs = new ArrayList\u003c\u003e();\n            for (long e = now - EPOCHS_SHOWN + 1; e \u003c= now; e++) epochs.add(e);\n            List\u003cMap\u003cString, Object\u003e\u003e rows = new ArrayList\u003c\u003e();\n            for (Row row : Cassandra.session().execute(\"SELECT epoch, reports, swept_at, swept_by FROM beacon.stats WHERE epoch IN ?\", epochs)) {\n                rows.add(Map.of(\n                        \"epoch\", row.getLong(\"epoch\"),\n                        \"reports\", row.getInt(\"reports\"),\n                        \"sweptAt\", String.valueOf(row.getInstant(\"swept_at\")),\n                        \"sweptBy\", String.valueOf(row.getString(\"swept_by\"))));\n            }\n            ctx.json(Map.of(\"epoch\", now, \"leader\", Leader.current(), \"rows\", rows));"},{"id":"logstream","kind":"code","label":"GET /api/log over SSE","detail":"Each replica streams its own recent lines and then every new line; the forwarder's ?replica= is what lets the page open one per replica.","path":"src/main/java/dev/amayz/beacon/LogStream.java","lines":[9,23],"sha256":"1386c13889a74791ded58b9d23e3a45a12eac5a182d56c4560ff98c4c82190c0","excerpt":" * GET /api/log streams this replica's log lines as server-sent events. The page opens one stream per\n * replica (the forwarder routes ?replica=A|B), so it sees both sides of a failover. Each client parks\n * on a virtual thread; a closed browser tab unsubscribes it.\n */\nfinal class LogStream {\n    private LogStream() {}\n\n    static void routes(Javalin app) {\n        app.sse(\"/api/log\", (SseClient client) -\u003e {\n            client.keepAlive();\n            for (String line : Log.recent()) client.sendEvent(\"log\", line);\n            Consumer\u003cString\u003e push = line -\u003e client.sendEvent(\"log\", line);\n            Log.subscribe(push);\n            client.onClose(() -\u003e Log.unsubscribe(push));\n            Log.out(\"[Log] stream opened, subscribers=%d\", Log.subscribers());"},{"id":"readme-table","kind":"documentation","label":"What is real Find My and what is toy","detail":"The README's contract table: what the demo keeps from the real protocol and what it shrinks.","path":"README.md","lines":[36,46],"sha256":"54014cbb503711b68a24ca744cb92ebb9f155e47f33df9b025ae85ba277694e9","excerpt":"## What is real Find My and what is toy\n\n| Real Find My | Here |\n| --- | --- |\n| AirTag broadcasts a rotating P-224 public key over Bluetooth every 15 minutes | The tab publishes one P-256 public key per 60-second epoch to the server, 30 epochs ahead |\n| Nearby iPhones pick up the key, encrypt their location to it, upload to Apple | Simulated finders in the same tab fetch the epoch key and encrypt in the browser |\n| Keys are derived from a master beacon key with a KDF and a counter | HKDF-SHA256(seed, epoch) becomes the private scalar; the seed never leaves the browser |\n| Apple indexes reports by SHA-256 of the public key; the owner queries hashes | Same: reports are keyed by SHA-256(public key), the owner fetches up to 97 hashes |\n| ECIES with the advertised key: ECDH, KDF, AES-GCM | ECDH P-256 with an ephemeral key, HKDF-SHA256, AES-256-GCM |\n| Millions of finders, billions of reports, rate limits everywhere | Two JVM replicas, one Cassandra node, a token bucket per finder |\n| The owner's devices share the seed through iCloud Keychain | The tab that minted the item holds the seed; close it and the item is gone |"},{"id":"readme-threads","kind":"documentation","label":"README: three kinds of thread","detail":"Jetty virtual threads per request, the fetch fan-out on virtual threads (160 to 290 ms sequential, 24 to 32 ms fanned out), the sweeper on one daemon thread.","path":"README.md","lines":[75,87],"sha256":"54014cbb503711b68a24ca744cb92ebb9f155e47f33df9b025ae85ba277694e9","excerpt":"### Threads ([commit 7](https://github.com/songz/beacon/commit/d9b1358))\n\nThree kinds of thread, each chosen for its job:\n\n- Jetty serves every request on a virtual thread (`useVirtualThreads`), so a blocked Cassandra call\n  parks the request instead of pinning a pool thread.\n- The owner's fetch of up to 97 key hashes fans out on a `newVirtualThreadPerTaskExecutor` with\n  `invokeAll`, which keeps order and rethrows the first failure. Sequential it took 160 to 290 ms on\n  the box; fanned out it takes 24 to 32 ms. Every fetch logs its own measurement:\n  `[Fetch] 15 key hashes in 8 ms on virtual threads · 20 reports found`.\n- The sweeper is a single-thread `ScheduledExecutorService`: one job every 30 seconds, one daemon thread.\n\nNothing blocks on the HTTP thread that is not a parked virtual thread."},{"id":"readme-zk","kind":"documentation","label":"README: the failover, measured","detail":"pm2 stop of the leader; the other replica acquired 764 ms later; a graceful stop releases the latch, a kill -9 waits for the 6 s session timeout.","path":"README.md","lines":[141,160],"sha256":"54014cbb503711b68a24ca744cb92ebb9f155e47f33df9b025ae85ba277694e9","excerpt":"### ZooKeeper ([commit 6](https://github.com/songz/beacon/commit/125ed16))\n\nTwo replicas run behind one hostname. Each joins a Curator `LeaderLatch` at `/beacon/leader`: an\nephemeral sequential znode per replica, lowest wins. Only the leader runs the 30-second sweep; the\nother logs that it skipped and who the leader is. The page header shows `served by replica A · leader is B`.\n\nFailover test, from the page: press **kill the leader**. `POST /api/chaos/kill-leader?replica=\u003cleader\u003e`\nmakes the leader exit; the panel shows the other replica's `[Leader] acquired` well under a second later,\nand pm2 restarts the dead JVM (about 15 seconds: JVM boot plus the Cassandra connect) as a follower.\nFrom the box, the same thing:\n\n```\npm2 stop beacon-b            # B was leader\n# beacon-a log, 764 ms later:  [Leader] acquired by replica A\npm2 restart beacon-b         # B rejoins as follower; A stays leader\n```\n\nA graceful stop releases the latch in the shutdown hook, so handover is sub-second. A `kill -9` leaves\nthe ephemeral node until the 6-second ZooKeeper session timeout expires, then the other replica takes\nover. Both replicas' `/health` show `leader`, `isLeader` and the ZooKeeper connection state."},{"id":"inf-finder-local-key","kind":"inference","label":"The simulated finder reads the key from the item object, not from the server","detail":"report() in sim.js calls keyFor(item, epochAt()) on the item it shares the tab with; it never calls GET /api/schedules/:shareId/current. That route exists for a finder in another tab, and in the real protocol the public key arrives over Bluetooth. Inferred from reading sim.js; the README's phrase \"finders fetch the epoch key\" describes the protocol, not this code path."},{"id":"inf-page-calls","kind":"inference","label":"What the page calls and what it does not","detail":"sim.js calls GET /health, POST /api/schedules/:shareId, POST and GET /api/reports, GET /api/log?replica=A|B (SSE) and POST /api/chaos/kill-leader?replica=. It never calls GET /api/schedules/:shareId/current, GET /api/stats or GET /api/whereami: those serve a finder in another tab, a stats reader and a finder without geolocation, none of which the simulation has. The sweep is visible on the page only through the [Sweep] lines in the log panel."},{"id":"inf-replica-choice","kind":"inference","label":"Which replica an example lands on is an illustration","detail":"The forwarder hashes each finder's random id, so which replica a given sprite meets is decided at page load. This walkthrough sends finder 2 to A and finder 5 to B, and lets the owner's unpinned calls land on A, purely to keep the pictures readable. Any real page may differ."},{"id":"ill-values","kind":"illustration","label":"Synthetic example values","detail":"Finder ids such as uVWWk-LpQ2…, the item 🎒 at x 31.2, y 44.0, key hash yfjwAmFx…, a 169-byte envelope, bucket levels like 0.5 of 10, and log lines quoted with counts are invented to match the code's formats. None is a captured value from the live system."},{"id":"obs-live","kind":"inference","label":"One observation of the live page, 2026-09-30","detail":"Observed on https://beacon.amayz.dev in the box's Chrome on 2026-09-30, about 100 s after load, read from the page's DOM and window.beaconStats; a single look, not a controlled measurement. Header: served by A, leader A. Counters: 27 reports stored, 45 rejected with 429, 3 key rotations seen, 26 sightings decrypted in the tab, 3 items. Log lines seen: \"[Fetch] 15 key hashes in 1 ms on virtual threads, 13 reports found\" and a second at 2 ms with 26 found, both on A; \"[Report] finder 3 ... 169 B of ciphertext stored under key hash ...\" on B; \"[RateLimit] finder 5 spammy ... throttled, 0.8/10 tokens, ip 100/100, 429 retry in 1 s (+16 more 429s this second)\" on B; \"[Sweep] replica A counted 411 reports across 11 epochs in 8 ms\" and \"[Sweep] skipped on replica B, leader is A\"; \"[Schedule] share=... keys=31 epochs=N..N+30\" on A. The 📍 markers read \"seen 3s ago by finder 5\", \"by finder 3\" and \"by finder 3\", so the spammy finder's one-per-second successes also reach the owner. This agrees with the code reading: 15 hashes per owner poll, 31 keys per publish, 169-byte envelopes, the spammy finder pinned to one replica, one replica sweeping. The kill button was not pressed during this observation."}],"components":[{"id":"tab","name":"Browser tab: items 🎒🔑🚲, finders 📱, owner 🏠, log panel","kind":"client","boundary":"Your browser tab (one page, one JavaScript process)","description":"All the sprites are objects in ONE tab: the items hold their seeds, the finders encrypt, the owner decrypts. Nothing on the page is a second device; only HTTP requests leave the tab. web/sim.js drives it, web/crypto.js is the protocol.","evidence":["sim-header","crypto-header","index-page","inf-page-calls"]},{"id":"fwd","name":"Forwarder on :3018","kind":"service","boundary":"Forwarder (pm2 process beacon.amayz.dev, Node)","description":"Fifty lines of Node behind myproxy. Pins ?replica=A|B requests, pins each finder id to one replica by hash, round-robins the rest, and retries an unpinned request once on the other replica when one refuses connections.","evidence":["fwd-header","fwd-pick","fwd-retry","ecosystem"]},{"id":"ra","name":"Replica A: Javalin HTTP (Api, Chaos, LogStream)","kind":"service","boundary":"Java replica A (pm2 beacon-a, one JVM on :18081)","description":"The JVM's HTTP layer. Every request runs on a Jetty virtual thread. Validates shapes and sizes, never content. Answers /health with its own id, the leader id and its ZooKeeper state.","evidence":["main-virtual","api-routes","main-health"]},{"id":"ra-bucket","name":"Token buckets (A)","kind":"module","boundary":"Java replica A (pm2 beacon-a, one JVM on :18081)","description":"In-process ConcurrentHashMap of TokenBucket per finder id (10, refill 1/s) and per client IP (100, refill 20/s). Only this JVM's requests count against them, which is why the forwarder pins finders.","evidence":["rl-header","tb-header"]},{"id":"ra-cql","name":"CqlSession holder singleton (A)","kind":"module","boundary":"Java replica A (pm2 beacon-a, one JVM on :18081)","description":"Cassandra.session() returns Holder.INSTANCE: one CqlSession per process, built once under the class-init lock, lock-free afterwards. Every store call and the sweeper go through it.","evidence":["cass-holder","cass-connect","singleton-test"]},{"id":"ra-curator","name":"Curator client singleton + LeaderLatch (A)","kind":"module","boundary":"Java replica A (pm2 beacon-a, one JVM on :18081)","description":"Zk.client() is the same holder idiom around one CuratorFramework; Leader wraps a LeaderLatch on /beacon/leader and answers isLeader() and current().","evidence":["zk-holder","leader-start","leader-isleader"]},{"id":"ra-fanout","name":"Virtual-thread fetch fan-out (A)","kind":"module","boundary":"Java replica A (pm2 beacon-a, one JVM on :18081)","description":"CassandraStore.reports(): one virtual thread per key hash, invokeAll, executor closed per call. Turns 15 sequential partition reads into one round trip's worth of waiting.","evidence":["store-reports","store-reportsfor"]},{"id":"ra-sweeper","name":"Sweeper, leader-only (A)","kind":"module","boundary":"Java replica A (pm2 beacon-a, one JVM on :
